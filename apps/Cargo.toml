# CatCard apps (docs/APPS.md): thumb-only binaries, built here rather than in the main
# workspace so host builds never try to link them.
[workspace]
resolver = "3"
members = ["flappy", "games", "hello", "probe", "spin"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[profile.release]
# Apps live compressed in flash, so size counts. "s" keeps the hot paths fast as long as
# they are marked `#[inline(always)]` (catcard-ui's per-pixel accessors are); an app that
# needs more can take `opt-level = 3` for itself with [profile.release.package.<name>].
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
debug = 2
overflow-checks = true
