[workspace]
# Apps are thumb-only binaries with their own workspace (docs/APPS.md).
exclude = ["apps"]
resolver = "2"
members = [
    "crates/catcard-alloc",
    "crates/catcard-app",
    "crates/catcard-backup",
    "crates/catcard-bbqr",
    "crates/catcard-bcur",
    "crates/catcard-board",
    "crates/catcard-flash",
    "crates/catcard-fwhdr",
    "crates/catcard-callgate",
    "crates/catcard-wallet",
    "crates/catcard-entropy",
    "crates/catcard-pin",
    "crates/catcard-png",
    "crates/catcard-evm",
    "crates/catcard-fido",
    "crates/catcard-solana",
    "crates/catcard-hal",
    "crates/catcard-kernel",
    "crates/catcard-nfc",
    "crates/catcard-ui",
    "crates/catcard-fw",
    "crates/catcard-settings",
    "crates/catcard-sign",
    "crates/catcard-upgrade",
    "crates/catcard-usb",
    "crates/catcard-sd",
    "crates/catcard-log",
    "crates/catcard-qr",
    "crates/catcard-tss",
    "tools/catcard-image",
]

# `cargo build` / `cargo test` with no `-p` operates on host-buildable crates only.
# The firmware crates need `--target thumbv7em-none-eabihf` (see `cargo fw`).
default-members = [
    "crates/catcard-alloc",
    "crates/catcard-backup",
    "crates/catcard-bbqr",
    "crates/catcard-bcur",
    "crates/catcard-board",
    "crates/catcard-fwhdr",
    "crates/catcard-entropy",
    "crates/catcard-flash",
    "crates/catcard-qr",
    "crates/catcard-pin",
    "crates/catcard-png",
    "crates/catcard-evm",
    "crates/catcard-fido",
    "crates/catcard-solana",
    "crates/catcard-settings",
    "crates/catcard-upgrade",
    "crates/catcard-usb",
    "crates/catcard-sign",
    "crates/catcard-wallet",
    "crates/catcard-tss",
    "tools/catcard-image",
    "crates/catcard-nfc",
]

[workspace.package]
# Stock firmware refuses to stage an image whose header version is below 3, and that
# is the route CatCard is installed through. See docs/FLASHING.md.
version = "7.0.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/catcard/catcard"
authors = ["Karpeles Lab Inc."]

[workspace.dependencies]
catcard-alloc = { path = "crates/catcard-alloc", default-features = false }
catcard-backup = { path = "crates/catcard-backup", default-features = false }
catcard-bbqr = { path = "crates/catcard-bbqr", default-features = false }
catcard-bcur = { path = "crates/catcard-bcur", default-features = false }
catcard-board = { path = "crates/catcard-board", default-features = false }
catcard-flash = { path = "crates/catcard-flash", default-features = false }
catcard-settings = { path = "crates/catcard-settings", default-features = false }
catcard-sign = { path = "crates/catcard-sign", default-features = false }
catcard-wallet = { path = "crates/catcard-wallet", default-features = false }
catcard-fido = { path = "crates/catcard-fido", default-features = false }
catcard-tss = { path = "crates/catcard-tss", default-features = false }
catcard-fwhdr = { path = "crates/catcard-fwhdr", default-features = false }
catcard-callgate = { path = "crates/catcard-callgate" }
catcard-pin = { path = "crates/catcard-pin", default-features = false }
catcard-upgrade = { path = "crates/catcard-upgrade", default-features = false }
catcard-usb = { path = "crates/catcard-usb", default-features = false }
catcard-qr = { path = "crates/catcard-qr", default-features = false }
catcard-png = { path = "crates/catcard-png", default-features = false }
catcard-solana = { path = "crates/catcard-solana", default-features = false }
# The small signature table by default; a board with flash to spare can add
# `catcard-evm/full-signatures` to its own feature list.
catcard-evm = { path = "crates/catcard-evm", default-features = false, features = [
    "common-signatures",
] }
# Selector -> ABI and calldata -> parameters, for saying what an EVM transaction does.
# `no_std`, no alloc.
#
# **The table is chosen by `catcard-evm`, not here.** 0.1.17 splits it in two:
# `signatures` is all 647 and costs about 146 KB of flash, `common-signatures` is the
# thirteen that move money. Which one a build carries is a board decision, so it is
# forwarded rather than fixed (see that crate's features). `scan` -- recovering an ABI
# from deployed bytecode -- is for a machine with the bytecode to hand, which a wallet
# holding a transaction is not.
evmabiless = { version = "0.1.17", default-features = false, features = ["decode"] }

# --- compcol: deflate, no_std and no alloc (its `embed::flate`; minizlib, retired, was
# the same code) ---
#
# The device decompresses: the upgrade transport (BBQr's `Z` is raw deflate), PNG (its
# image data is a zlib stream, and the Adler-32 at its end is the one check that the
# picture arrived whole), the baked art, and apps unpacked from the image. The
# compressor is in the same module; firmware never calls it, so LTO leaves it out, and
# the host tools and tests use it to build what the device reads.
compcol = { version = "0.7.2", default-features = false, features = ["embed", "deflate", "zlib"] }
catcard-sd = { path = "crates/catcard-sd" }
catcard-log = { path = "crates/catcard-log" }
catcard-entropy = { path = "crates/catcard-entropy", default-features = false }
catcard-hal = { path = "crates/catcard-hal" }
catcard-kernel = { path = "crates/catcard-kernel" }
catcard-ui = { path = "crates/catcard-ui" }

# --- embedded ---
cortex-m = { version = "0.7.7", features = ["inline-asm"] }
cortex-m-rt = "0.7.6"
critical-section = "1.2.0"
# `zeroize`: an in-place wipe of a `String` or `Vec`'s whole buffer, for the passphrase
# and text-entry fields. Without it the only wipe is of a moved-out copy.
heapless = { version = "0.9.3", features = ["zeroize"] }

# --- crypto: purecrypto, our own pure-Rust no_std/no-alloc toolkit ---
# One stack for hashing, HMAC, secp256k1 (ECDSA + BIP340 Schnorr + point ops) and
# RIPEMD-160. `unsafe_code = "deny"` upstream, edition 2024 / Rust 1.89 like us.
# Firmware crates take only no-alloc features (`hash`, `ec`, `hazmat-secp256k1`,
# `bip340`); the host tool adds the alloc/`std` pieces (PEM key loading).
#
# 0.9.3 puts the P-256 fixed-base comb table behind `p256-table`. **Leave it off**: it
# is about 60 KB of flash, and the security key (`catcard-fido`) signs a handful of
# times per login, where the table-less ladder costs a fraction of a second.
purecrypto = { version = "0.9.3", default-features = false }
# --- tsslib: threshold signing, our own crate (docs/TSS.md) ---
#
# DKLs23 threshold ECDSA only. `std` stays off: the crate is then `no_std` + `alloc`,
# takes its randomness from the source `catcard-tss` registers, and its sessions are
# polled rather than waited on. `json` stays off too: keys and messages use tsslib's
# compact binary encoding (`tsslib::wire`), and nothing here links serde_json for it.
# (0.2.12 also brings `frostsecp256k1tss`, FROST for Taproot: stage 2, not enabled.)
tsslib = { version = "0.2.12", default-features = false, features = ["dklstss"] }
# The lock around the protocol DRBG tsslib draws from (tsslib already links it).
spin = { version = "0.10", default-features = false, features = ["spin_mutex", "once"] }
# Memory hygiene, not a primitive: kept.
zeroize = { version = "1.9.0", default-features = false }

# --- JSON: the settings blob, which another firmware may have written ---
# Ours. Streaming pull parser plus an in-place editor, `no_std`, no allocator, no
# `unsafe`, a few hundred bytes of state regardless of document size. Taken for two
# properties the settings store needs: values come back as the **raw bytes they were
# written as** (`raw_value`, zero copy), so a key this firmware has never heard of
# survives a save byte-identically; and `edit::apply` changes one value in place by
# moving the document's tail once, rather than re-rendering the object around it.
emjson = { version = "0.1.1", default-features = false }

# --- shared ---
bitflags = { version = "2.13.1", default-features = false }

# --- barcodes: QR for showing an address to a watch-only wallet ---
# `#![no_std]`, `forbid(unsafe_code)`, MIT. Only the heap-free half is taken: the
# `encode_into` encoders write a module grid into buffers the caller owns, so the
# firmware needs no allocator. `alloc`, `decode` and `scan` stay off, which also
# leaves out every symbology but QR.
anyd = { version = "0.1.4", default-features = false, features = ["encode", "qr"] }
# --- outscript: output scripts, addresses and PSBT, our own no_std/no-alloc crate ---
#
# Bitcoin only, and no `alloc`: that leaves scripts, addresses, `btcraw`'s sighashes and
# the PSBT roles, all writing into caller buffers. The other chains stay out of the image
# until there is something to do with them.
fstool = { version = "0.4.35", default-features = false }
outscript = { version = "0.2.4", default-features = false, features = ["bitcoin", "bbqr", "bcur"] }

# --- host tooling ---
anyhow = "1.0.104"
clap = { version = "4.6.5", features = ["derive"] }
hex = "0.4.3"
object = "0.40.0"

[profile.release]
codegen-units = 1
debug = 2          # keep DWARF in the ELF; the .bin is unaffected
lto = "fat"
opt-level = "s"    # firmware is flash-bound, not compute-bound
overflow-checks = true
panic = "abort"

# Threshold signing's protocol code, built for size. The TSS screens bring in all of
# tsslib's DKLs parties (a session dispatches over keygen and both signing kinds) and
# catcard-tss: at "s" that took the mk4/mk5 image past its ceiling (2026-10-03, when
# serde_json's parser came with them). Nothing on the boot path is in them, and the heavy
# arithmetic -- EC multiplications, AES, hashing -- is purecrypto's, which stays at "s".
# The keygen and signing times in docs/TSS.md were taken at "s" and want re-measuring on
# the device.
[profile.release.package.tsslib]
opt-level = "z"

[profile.release.package.catcard-tss]
opt-level = "z"

[profile.dev]
opt-level = 1      # -O0 thumb builds do not fit comfortably and run too slowly
