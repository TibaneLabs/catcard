[package]
name = "catcard-pin"
description = "PIN login state machine over bootloader callgate 18"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = ["std"]
std = []

[dependencies]
catcard-callgate.workspace = true
zeroize.workspace = true

[dev-dependencies]
# Only to check the index-to-word vectors below. Not a runtime dependency: the PIN gate
# has no business being able to reach wallet code, and rendering words is the caller's.
catcard-wallet = { workspace = true, features = ["std"] }
