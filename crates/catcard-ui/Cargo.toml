[package]
name = "catcard-ui"
description = "Display framebuffer and panel command sets for CatCard"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
catcard-board.workspace = true
catcard-entropy = { workspace = true, default-features = false }
heapless.workspace = true
zeroize.workspace = true
# Inflates the baked art straight onto the canvas: see `art::indexed`.
minizlib.workspace = true

[dev-dependencies]
# The tests deflate pictures of their own to check the decoder against.
minizlib = { version = "0.1.1", default-features = false, features = ["decompress", "compress", "fixed", "dynamic", "stored"] }
