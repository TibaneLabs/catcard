[package]
name = "catcard-wallet"
description = "Wallet logic: encodings, BIP-32/39, addresses, transactions, chain registry"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
# Every chain on by default. A single-coin build turns them off explicitly:
#   --no-default-features --features chain-bitcoin
default = ["std", "chain-bitcoin", "chain-ethereum", "chain-solana"]
std = []

chain-bitcoin = []
chain-ethereum = []
chain-solana = []

[dependencies]
hmac.workspace = true
k256 = { version = "0.14.0", default-features = false, features = ["arithmetic"] }
ripemd = { version = "0.2.0", default-features = false }
sha2.workspace = true
subtle.workspace = true
zeroize = { workspace = true, features = ["derive"] }
