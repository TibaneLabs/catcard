[package]
name = "catcard-settings"
description = "Authenticated, power-fail-safe settings store over SPI-NOR"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = ["std"]
std = []

[dependencies]
# The PushTx service-URL rule, so a stored URL is checked the way the tag writer
# checks it and the two can never disagree.
catcard-nfc = { path = "../catcard-nfc" }
emjson = { workspace = true }
purecrypto = { workspace = true, features = ["hash", "cipher", "kdf"] }
heapless = { workspace = true }
zeroize = { workspace = true, features = ["derive"] }

[dev-dependencies]
# The co-signing key's stored value is checked end to end against the wallet code: the
# phrase it holds, the fingerprint and xpub it names, and the `ccxp` bundle it exports.
catcard-wallet = { path = "../catcard-wallet" }
