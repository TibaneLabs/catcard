[package]
name = "catcard-wallet"
description = "Wallet logic: encodings, BIP-32/39, addresses, transactions, chain registry"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
# Every chain on by default. A single-coin build turns them off explicitly:
#   --no-default-features --features chain-bitcoin
default = ["std", "chain-bitcoin", "chain-ethereum", "chain-solana"]
std = []

chain-bitcoin = []
chain-ethereum = []
chain-solana = []

[dependencies]
purecrypto = { workspace = true, features = ["hash", "ec", "hazmat-secp256k1"] }
zeroize = { workspace = true, features = ["derive"] }
outscript = { workspace = true }
