[package]
name = "catcard-upgrade"
description = "Staging and validating a firmware image for the bootloader to install"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = ["std"]
std = ["catcard-fwhdr/std", "catcard-sign/std"]

[dependencies]
catcard-board.workspace = true
catcard-fwhdr = { workspace = true, default-features = false }
catcard-flash = { workspace = true, default-features = false }
catcard-sign = { workspace = true, default-features = false }
minizlib = { workspace = true }

[dev-dependencies]
# The compressor, to build test fixtures with the code that will decode them.
minizlib = { version = "0.1.0", default-features = false, features = ["decompress", "compress", "fixed", "dynamic", "stored"] }
