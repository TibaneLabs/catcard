[package]
name = "catcard-wallet"
description = "Wallet logic: encodings, BIP-32/39, addresses, transactions, chain registry"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
# Two products, not a lattice. **Bitcoin is always compiled** -- it is what this device
# is -- and `multichain` adds the rest, so there are two firmware shapes to build, test
# and reason about rather than one per subset. The per-chain features this replaced cost
# more in build matrix and cfg noise than the granularity was ever worth: nobody ships a
# Solana-only Coldcard.
#
#   cargo test -p catcard-wallet                            # bitcoin only
#   cargo test -p catcard-wallet --features multichain      # everything
default = ["std"]
std = []

# Bitcoin-Cash, Litecoin, Dogecoin, ElectraProto, Ethereum (and other EVM chains),
# Monacoin, Solana, Tron. The registry in `chain` says which of those this build actually
# carries; the feature is the line between the two products.
# Ethereum/Tron need Keccak and EIP-55, Solana ed25519: outscript's `evm` and `solana`,
# pulled in only here so a Bitcoin build carries neither.
multichain = ["outscript/evm", "outscript/solana"]

[dependencies]
purecrypto = { workspace = true, features = ["hash", "ec", "hazmat-secp256k1"] }
zeroize = { workspace = true, features = ["derive"] }
outscript = { workspace = true }
