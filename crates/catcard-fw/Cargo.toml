[package]
name = "catcard-fw"
description = "CatCard firmware binary"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
# The USB bench crutches, ON by default through this development period: every image
# flashed to a dev device (dev key, no real secret) carries them, which is how the host
# drives the UI and reads diagnostics while the firmware is being built out. A real
# release must strip them -- build through the `fw-*-ship` aliases, or `make ... SHIP=1`,
# which pass `--no-default-features` and leave only the board.
#
# `usb-key-injection` lets a host press keys, which removes the physical-presence
# confirmation the rest of the design rests on -- a host can approve its own firmware
# upgrade. `usb-debug-mem` exposes peek / poke / jsr over USB: read any address, write any
# address, call any address -- the most dangerous thing in this firmware. On a provisioned
# device it would read the seed and PIN out of RAM and run arbitrary code, so it must
# never ship. Each is its own feature so a release drops them cleanly. See docs/USB.md.
default = ["usb-key-injection", "usb-debug-mem"]
usb-key-injection = []
usb-debug-mem = []
board-mk3 = ["catcard-board/board-mk3", "catcard-hal/board-mk3"]
board-mk4 = ["catcard-board/board-mk4", "catcard-hal/board-mk4"]
board-mk5 = ["catcard-board/board-mk5", "catcard-hal/board-mk5"]
board-q1 = ["catcard-board/board-q1", "catcard-hal/board-q1"]

[dependencies]
zeroize = { workspace = true, default-features = false }
catcard-board.workspace = true
catcard-callgate.workspace = true
catcard-entropy = { workspace = true, default-features = false }
catcard-fwhdr = { workspace = true, default-features = false }
catcard-hal.workspace = true
catcard-pin = { workspace = true, default-features = false }
catcard-upgrade = { workspace = true, default-features = false }
catcard-usb = { workspace = true, default-features = false }
catcard-sd.workspace = true
catcard-log.workspace = true
catcard-wallet = { workspace = true, default-features = false }
catcard-ui.workspace = true
cortex-m.workspace = true
heapless.workspace = true
cortex-m-rt.workspace = true

[build-dependencies]
catcard-board.workspace = true
