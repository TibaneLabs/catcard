# CatCard apps (docs/APPS.md): thumb-only binaries, built here rather than in the main
# workspace so host builds never try to link them.
[workspace]
resolver = "3"
members = ["hello", "probe", "spin"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[profile.release]
# Apps choose their own trade-off; these test apps favour speed, like a game would.
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = 2
overflow-checks = true
