[package]
name = "catcard-nfc"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
default = []
std = []

[dependencies]
# SHA-256 for the PushTx checksum, and nothing else.
purecrypto = { workspace = true, features = ["hash"] }
# The driver's scratch buffers, wiped on the way out.
zeroize = { workspace = true }
