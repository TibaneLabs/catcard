[package]
name = "catcard-sealed"
description = "A seed sealed at rest under Argon2id(passphrase, device secret): the Precursor's storage record"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
# `alloc`: Argon2 allocates its memory matrix.
purecrypto = { workspace = true, features = ["kdf", "cipher", "alloc"] }
zeroize = { workspace = true, features = ["derive"] }
