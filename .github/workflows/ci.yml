name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Fixed build timestamp so image digests are comparable across runs.
  SOURCE_DATE_EPOCH: "1785628800"

jobs:
  host:
    name: Host tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      # `catcard-kernel` is ARM-only for the same reason `catcard-fw` is -- its context
      # switch is Cortex-M assembly, and cortex-m's register access does not build for a
      # host at all. The Makefile has excluded it all along and this had not, so the host
      # job failed on `invalid register r0` before reaching a single test of ours.
      - run: cargo clippy --workspace --exclude catcard-fw --exclude catcard-kernel --all-targets
      - run: cargo test --workspace --exclude catcard-fw --exclude catcard-kernel

  firmware:
    name: ${{ matrix.board }} ${{ matrix.chains }}${{ matrix.games && ' +games' || '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Every shape that ships: three boards, two chain builds, games or not. Twelve
      # signed images per push, so a change that breaks one combination is caught on the
      # push that made it rather than the day someone builds that variant.
      matrix:
        board: [mk3, mk4-mk5, q1]
        chains: [bitcoin, multichain]
        games: [true, false]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf
          components: clippy
      - uses: Swatinem/rust-cache@v2

      # `mk4-mk5` is one image for two boards: built for mk5 and marked as accepted by
      # both, which is what `--hw-compat mk4,mk5` says in the header.
      - name: Work out the features for this shape
        id: shape
        run: |
          set -euo pipefail
          case "${{ matrix.board }}" in
            mk3)     board=mk3; pkg=mk3;  compat="" ;;
            mk4-mk5) board=mk5; pkg=mk5;  compat="--hw-compat mk4,mk5" ;;
            q1)      board=q1;  pkg=q1;   compat="" ;;
          esac
          # No bench crutches in anything published. `usb-debug-mem` is peek / poke /
          # jsr on any address -- it would read the seed and the PIN out of RAM and run
          # arbitrary code -- and `usb-key-injection` lets a host press the keys, which
          # removes the physical-presence confirmation the rest of the design rests on,
          # including approving a firmware upgrade. These artefacts are downloadable by
          # anyone, so they are built the way a release is: neither feature compiled in.
          # A bench build comes from `make` locally, where those are the default.
          feats="board-$board"
          name="catcard-${{ matrix.board }}-${{ matrix.chains }}"
          if [ "${{ matrix.chains }}" = multichain ]; then
            feats="$feats,multichain"
          fi
          # Plain `[ … ] && x=y` would return non-zero on the false leg and `set -e`
          # would end the step there -- silently, on half the matrix.
          if [ "${{ matrix.games }}" = true ]; then
            feats="$feats,games"
            name="$name-games"
          fi
          echo "features=$feats" >> "$GITHUB_OUTPUT"
          echo "package=$pkg" >> "$GITHUB_OUTPUT"
          echo "compat=$compat" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Clippy
        # No --all-targets: it adds the test harness target, which needs libtest, which
        # does not exist for a no_std thumb target.
        run: |
          cargo clippy --release -p catcard-fw \
            --target thumbv7em-none-eabihf \
            --no-default-features --features ${{ steps.shape.outputs.features }}

      - name: Build
        run: |
          cargo build --release -p catcard-fw \
            --target thumbv7em-none-eabihf \
            --no-default-features --features ${{ steps.shape.outputs.features }}

      # The debug monitor and key injection answer USB opcodes; a build carrying them
      # logs that it does, on every boot, in words. Finding either string in an image
      # meant for other people to download is the failure this guards, and checking the
      # bytes beats trusting the feature list to have stayed right.
      - name: No debug monitor, no key injection
        run: |
          set -euo pipefail
          elf=target/thumbv7em-none-eabihf/release/catcard-fw
          # Markers that track the features rather than the vocabulary: `debug_mem` is
          # the module, gated on `usb-debug-mem`; `injected`/`inject_key` are the key
          # path; and the boot warning is printed only by a build that has the monitor.
          # Deliberately *not* "peek" or "poke", which also match `Peekable` from the
          # filesystem iterators and `DebugPeek`, an opcode name that exists in every
          # build because only its handler is compiled out.
          #
          # A dev build trips this (25 matches when last checked); a published one must
          # have none.
          if strings -a "$elf" \
               | grep -niE "debug_mem|inject_key|injected|debug memory monitor is enabled"; then
            echo "::error::bench features leaked into a published image"
            exit 1
          fi
          echo "no debug monitor and no key injection in this image"

      # The build only proves it links. This proves the image the bootloader would
      # actually see is well-formed: header at 0x3F80, 512-aligned, signature over the
      # double-SHA256 digest, hw_compat permitting this board.
      - name: Assemble, sign and verify the image
        run: |
          set -euo pipefail
          mkdir -p out
          cargo run --release -p catcard-image -- build \
            target/thumbv7em-none-eabihf/release/catcard-fw \
            --board ${{ steps.shape.outputs.package }} \
            --version 0.0.1 ${{ steps.shape.outputs.compat }} \
            --bin out/${{ steps.shape.outputs.name }}.bin \
            --dfu out/${{ steps.shape.outputs.name }}.dfu
          cargo run --release -p catcard-image -- verify \
            out/${{ steps.shape.outputs.name }}.bin \
            --board ${{ steps.shape.outputs.package }}
          cargo run --release -p catcard-image -- info \
            out/${{ steps.shape.outputs.name }}.dfu

      # Signed with the published developer key, so these boot with a red genuine light
      # and a 25-second warning: they are not releases. They do carry no debug monitor
      # and no key injection, which is checked above rather than assumed.
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.shape.outputs.name }}
          path: out/${{ steps.shape.outputs.name }}.dfu
          if-no-files-found: error

  chain-shapes:
    name: Wallet (${{ matrix.chains }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        chains: [bitcoin, multichain]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      # A Bitcoin-only firmware is a product, not a configuration nobody builds. The code
      # behind a feature rots silently unless both shapes are compiled and tested -- and
      # the Bitcoin build is the one that has to prove the other chains are *absent*.
      - name: Features for this shape
        id: shape
        run: |
          if [ "${{ matrix.chains }}" = multichain ]; then
            echo "features=std,multichain" >> "$GITHUB_OUTPUT"
          else
            echo "features=std" >> "$GITHUB_OUTPUT"
          fi
      - name: Test
        run: |
          cargo test -p catcard-wallet \
            --no-default-features --features ${{ steps.shape.outputs.features }}
      - name: Clippy
        run: |
          cargo clippy -p catcard-wallet --all-targets \
            --no-default-features --features ${{ steps.shape.outputs.features }}

  reproducible:
    name: Reproducible build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@v2

      # With SOURCE_DATE_EPOCH fixed, the same tree must produce the same digest. If
      # this fails, something nondeterministic leaked into the image.
      - name: Build twice and compare digests
        run: |
          set -euo pipefail
          # The same features both times: `cargo fw-mk4` carries the default ones and
          # the check below passes `--no-default-features`, so this used to compare two
          # different firmwares and report the difference as non-determinism.
          build() {
            cargo build --release -p catcard-fw --target thumbv7em-none-eabihf \
              --no-default-features --features board-mk4 >/dev/null
            cargo run --release -q -p catcard-image -- build \
              target/thumbv7em-none-eabihf/release/catcard-fw \
              --board mk4 --version 0.0.1 --bin "$1" | grep '^digest'
          }
          a=$(build /tmp/a.bin)
          cargo clean -p catcard-fw
          b=$(build /tmp/b.bin)
          echo "first:  $a"
          echo "second: $b"
          [ "$a" = "$b" ] || { echo "::error::build is not reproducible"; exit 1; }
          cmp /tmp/a.bin /tmp/b.bin

      # Setting RUSTFLAGS makes cargo ignore .cargo/config.toml's rustflags table
      # outright. That once dropped -Tlink.x (the firmware linked at lld's default
      # base) and, separately, changed codegen between a local build and a CI build.
      # Nothing that reaches the output bytes may depend on the ambient environment.
      - name: Build is independent of ambient RUSTFLAGS
        run: |
          set -euo pipefail
          cargo clean -p catcard-fw
          env -u RUSTFLAGS cargo build --release -p catcard-fw \
            --target thumbv7em-none-eabihf --no-default-features --features board-mk4
          env -u RUSTFLAGS cargo run --release -q -p catcard-image -- build \
            target/thumbv7em-none-eabihf/release/catcard-fw \
            --board mk4 --version 0.0.1 --bin /tmp/no-rustflags.bin >/dev/null
          cmp /tmp/a.bin /tmp/no-rustflags.bin || {
            echo "::error::firmware bytes depend on whether RUSTFLAGS is set"; exit 1; }

  cleanroom:
    name: Clean-room boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The original firmware is not part of this repository and must not become part
      # of it. This is a cheap tripwire, not a proof.
      - name: No original-firmware artefacts in the tree
        run: |
          set -euo pipefail
          if find . -path ./.git -prune -o \
               \( -name '*.mpy' -o -name 'dis-*' -o -name 'libngu*' \
                  -o -name 'micropython-*' \) -print | grep -q .; then
            echo "::error::artefacts derived from the original firmware are present"
            find . -path ./.git -prune -o \
              \( -name '*.mpy' -o -name 'dis-*' -o -name 'libngu*' \
                 -o -name 'micropython-*' \) -print
            exit 1
          fi
      - name: MIT license is intact
        run: grep -q "MIT License" LICENSE && grep -q "Karpeles Lab Inc" LICENSE
