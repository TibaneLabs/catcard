[package]
name = "catcard-ui"
description = "Display framebuffer and panel command sets for CatCard"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = []
# The chains' logos in full colour, ~10 KB of deflated RGBA. Only a panel that takes 16
# bits a pixel can draw them, so only such a board's build turns this on: elsewhere the
# art is not merely unused, it is absent, and every row falls back to its one-bit form.
colour-marks = []

[dependencies]
catcard-board.workspace = true
catcard-entropy = { workspace = true, default-features = false }
heapless.workspace = true
zeroize.workspace = true
# Inflates the baked art straight onto the canvas: see `art::indexed`.
minizlib.workspace = true

[dev-dependencies]
# The tests deflate pictures of their own to check the decoder against.
minizlib = { version = "0.1.1", default-features = false, features = ["decompress", "compress", "fixed", "dynamic", "stored"] }
