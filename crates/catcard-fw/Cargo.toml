[package]
name = "catcard-fw"
description = "CatCard firmware binary"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
# `usb-key-injection` lets a host press keys, which removes the physical-presence
# confirmation the rest of the design rests on -- with it compiled in, a host can
# approve its own firmware upgrade. See docs/USB.md.
#
# It is deliberately NOT in `default`. Every firmware build goes through the `fw-*`
# aliases, which pass `--no-default-features`, so a default here would be inert and
# misleading -- it read as "on at this stage" while shipping nothing. Opt in with the
# `fw-*-bringup` aliases instead, so the crutch is always a visible choice.
default = []
usb-key-injection = []
# `show-pin` draws the PIN digits instead of asterisks. For bring-up only: during a
# first run the question is whether the keypad decodes to the digit printed on the cap,
# and a row of asterisks cannot answer it. Separate from `usb-key-injection` because
# they are different risks -- one lets a host press keys, this one puts a secret on a
# screen someone may be pointing a camera at. See docs/FLASHING.md.
show-pin = []
board-mk3 = ["catcard-board/board-mk3", "catcard-hal/board-mk3"]
board-mk4 = ["catcard-board/board-mk4", "catcard-hal/board-mk4"]
board-q1 = ["catcard-board/board-q1", "catcard-hal/board-q1"]

[dependencies]
catcard-board.workspace = true
catcard-callgate.workspace = true
catcard-entropy = { workspace = true, default-features = false }
catcard-fwhdr = { workspace = true, default-features = false }
catcard-hal.workspace = true
catcard-pin = { workspace = true, default-features = false }
catcard-upgrade = { workspace = true, default-features = false }
catcard-usb = { workspace = true, default-features = false }
catcard-wallet = { workspace = true, default-features = false }
catcard-ui.workspace = true
cortex-m.workspace = true
heapless.workspace = true
cortex-m-rt.workspace = true

[build-dependencies]
catcard-board.workspace = true
