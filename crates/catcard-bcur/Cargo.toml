[package]
name = "catcard-bcur"
description = "BC-UR: uniform resources over animated QR, for payloads that are not Bitcoin's"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
heapless.workspace = true
outscript = { workspace = true }

[dev-dependencies]
# For the one test that starts from the BCR's own BIP-39 phrase and derives its way to
# the published account bytes. A dev-dependency only: the crate itself knows nothing
# about keys, and must not -- it encodes what it is handed.
catcard-wallet = { workspace = true, features = ["std"] }
