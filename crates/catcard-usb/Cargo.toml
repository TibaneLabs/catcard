[package]
name = "catcard-usb"
description = "CatCard's USB HID transport framing and descriptors"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = ["std"]
std = []

[dependencies]
catcard-board.workspace = true
# X25519 ECDH, HKDF-SHA256 and ChaCha20-Poly1305 for the encrypted channel (`ncry`).
# No-alloc features only: the firmware has no allocator on this path.
purecrypto = { workspace = true, features = ["ec", "kdf", "cipher"] }
# The session keys are secrets, wiped on drop.
zeroize = { workspace = true }
